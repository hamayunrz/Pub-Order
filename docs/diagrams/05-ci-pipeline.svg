8;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link F6 to E1--><g class="link" data-entity-1="ent0014" data-entity-2="ent0015" id="lnk28" data-source-line="47" data-link-type="dependency"><path d="M816.49,290.629 C837.94,266.849 863.112,238.923 888.152,211.143" style="stroke:#181818;stroke-width:1;" fill="none" id="F6-to-E1"/><polygon points="891.5,207.429,882.503,211.436,888.152,211.143,888.445,216.792,891.5,207.429" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link F6 to D1--><!--link E1 to D1--><g class="link" data-entity-1="ent0015" data-entity-2="ent0016" id="lnk30" data-source-line="49" data-link-type="dependency"><path d="M949.5,207.639 C949.5,225.719 949.5,238.789 949.5,256.869" style="stroke:#181818;stroke-width:1;" fill="none" id="E1-to-D1"/><polygon points="949.5,261.869,953.5,252.869,949.5,256.869,945.5,252.869,949.5,261.869" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="51"><rect x="176.753" y="460.703" width="684.693" height="115.656" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="181.753" y="480.236" fill="#000" font-size="14" textLength="626.028">Each job's steps run in order and stop at the first failure; unit and integration tests are separate steps.</text><text x="181.753" y="497.846" fill="#000" font-size="14" textLength="560.328">backend, frontend and e2e are required checks on main, so a red check blocks the merge.</text><text x="181.753" y="515.455" fill="#000" font-size="14" textLength="456.784">deliver runs only after every test job passes; on pull requests it is skipped.</text><text x="181.753" y="533.064" fill="#000" font-size="14" textLength="527.659">Integration and E2E tests use a throwaway local Supabase, never the hosted project.</text><text x="181.753" y="550.674" fill="#000" font-size="14" textLength="478.14">Coverage gate: 70% of branches on both sides (the spec's minimum is 50%).</text><text x="181.753" y="568.283" fill="#000" font-size="14" textLength="674.693">deliver output: pub-order-0.3.&lt;run>-&lt;commit>.zip, kept 90 days; a sprint3 tag also creates a GitHub Release.</text></g><?plantuml-src bLNDRjj64BxpAGO6Yjg89V_8Sb77413POkiYQ5shxINgOKaEnRMMkvlzgS4KlHRejU_G5ykJT8QaPCeeWlGs7CxlzytC1XaK9W3tCHlzu0fqS7DtSdCBzzAYaXhXy1iPleqPlCc3DDfVGK0V_BYfrH6vFKJjmMZ0tz0rOADIuF1z91CGkjYfVGN1G2saJf3KeKsgi0oiTd9T1IYampP5uZTIM-543RNH9g-SgH62YpZuuojHc2Ufrr0AvOT_2Yn5L24rEdmlo74fj5-Ya-N0XZC9lLRuOA8kRepJrFVPwS12cm8zMfXEXsv2RrXvCLHQaM_46fUXKVWSE4bwFHna973JZoOxWDy9ivqH7Dnf7uHIAtrefTPOh3IZHqZKg8C_EW3XONwsx_DMwa0EBfPbRt2-R_1JOn7o2lCDcTMDRNgpoRxPprg6ZanEtx3K6rwyB3BWsWdcPcUlJ2uKBACLcV1ujT9lxk_Wuvz_WuYXQeNR-V5ABtzysrMoxMMw7_h6q80GIjotDOxx-lZNF_3LwHUz_MNonm3AqX6hdu5bPpzQQIfpCtxqHdVXql-6Sh5aeJVv59ZwH5o1LJJ6yDsoj_yKgh_8PrJJpq1rp_v_GfMsK0qShhCPdYD3TNsIpLPwfUVEF7cQz6swUoMQftRxZbOwwtyoTrm72okT2X-sr6xPRjCjpbucA-XUK8dF2OrM3T-6uVgJre40RnqXFe4WrbnO5gKgOCikpSsMSOhd2I0iu8EqfFUrsU28wmSPs2vcIb9quO8iHSwWl887L4XbScgAtw5pI-NEps0qcl6wpCyxQPBC9vrqaSmlEccQpAUTT9cadGVDHDfv4Djfvq5qffq74PLs7aJ1_BAL29rqJtfNoQ90_Ijfg9G5nNr7ID0zwJLq3DSys9a9mTJ4_4Ba5KFvfGSVq7fmKGFDdMblDDzM7um5GSDM8PJI4IIba2ewV0sHXv1jvCiX8wGGw8RHwIAAsyXZojRVgECT1ztrfl5X-_uc5VqgCx3CvJ5uGrpkVa36w-RRWcfqQ-J8swbmtKD14o7AGD_Toz0oILtI5VKU_UjkN9uV4KyqWoG8Dj9QB3ZWS6-uoCNvecyj4kU2ijCWYoVHmFwDEWRDETlgAaET5s2TUQGHvgZRxO8ruNB5MmMcX8mOejRQZecP2hoaPm4EEOQtc1CvjTIoZZKNEQLL7BPiOh0nqC6WfxMbRNGwdeol2OdPw3etTIt3RCnp3Hkq0Ru-XK8qXC7UUW0zRmPoXrGNiGVzQzpF-9YVqsvq_WK0?></g></svg>