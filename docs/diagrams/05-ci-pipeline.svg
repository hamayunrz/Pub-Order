.B2" id="ent0003" data-source-line="16"><rect x="184.5" y="116.719" width="49.552" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="194.5" y="141.252" fill="#000" font-size="14" textLength="22.572">Lint</text><text x="194.5" y="158.861" fill="#000" font-size="14" textLength="29.552">(ruff)</text></g><!--entity B3--><g class="entity" data-qualified-name="backend job.B3" id="ent0004" data-source-line="17"><rect x="297" y="116.719" width="91.586" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="307" y="141.252" fill="#000" font-size="14" textLength="71.586">Type check</text><text x="307" y="158.861" fill="#000" font-size="14" textLength="42.772">(mypy)</text></g><!--entity B4--><g class="entity" data-qualified-name="backend job.B4" id="ent0005" data-source-line="18"><rect x="441" y="116.719" width="78.352" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="451" y="141.252" fill="#000" font-size="14" textLength="58.352">Unit tests</text><text x="451" y="158.861" fill="#000" font-size="14" textLength="46.676">(pytest)</text></g><!--entity B5--><g class="entity" data-qualified-name="backend job.B5" id="ent0006" data-source-line="19"><rect x="564" y="99.219" width="132.868" height="90.438" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="574" y="123.752" fill="#000" font-size="14" textLength="99.613">Integration tests</text><text x="574" y="141.361" fill="#000" font-size="14" textLength="104.289">(local Supabase:</text><text x="574" y="158.971" fill="#000" font-size="14" textLength="112.868">API → auth → DB,</text><text x="574" y="176.58" fill="#000" font-size="14" textLength="80.138">SQL checks)</text></g><!--entity B6--><g class="entity" data-qualified-name="backend job.B6" id="ent0007" data-source-line="20"><rect x="742" y="107.719" width="80.703" height="72.828" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="752" y="132.252" fill="#000" font-size="14" textLength="60.703">Coverage</text><text x="752" y="149.861" fill="#000" font-size="14" textLength="36.572">report</text><text x="752" y="167.471" fill="#000" font-size="14" textLength="50.805">(≥ 70%)</text></g><!--entity F1--><g class="entity" data-qualified-name="frontend job.F1" id="ent0009" data-source-line="24"><rect x="35" y="290.719" width="82.255" height="72.828" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="45" y="315.252" fill="#000" font-size="14" textLength="36.572">Install</text><text x="45" y="332.861" fill="#000" font-size="14" textLength="62.255">(package-</text><text x="45" y="350.471" fill="#000" font-size="14" textLength="59.131">lock.json)</text></g><!--entity F2--><g class="entity" data-qualified-name="frontend job.F2" id="ent0010" data-source-line="25"><rect x="174" y="299.719" width="70.572" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="184" y="324.252" fill="#000" font-size="14" textLength="22.572">Lint</text><text x="184" y="341.861" fill="#000" font-size="14" textLength="50.572">(ESLint)</text></g><!--entity F3--><g class="entity" data-qualified-name="frontend job.F3" id="ent0011" data-source-line="26"><rect x="290" y="299.719" width="106.372" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="300" y="324.252" fill="#000" font-size="14" textLength="71.586">Type check</text><text x="300" y="341.861" fill="#000" font-size="14" textLength="86.372">(n/a: plain JS)</text></g><!--entity F4--><g class="entity" data-qualified-name="frontend job.F4" id="ent0012" data-source-line="27"><rect x="441" y="299.719" width="78.352" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="451" y="324.252" fill="#000" font-size="14" textLength="58.352">Unit tests</text><text x="451" y="341.861" fill="#000" font-size="14" textLength="44.338">(Vitest)</text></g><!--entity F5--><g class="entity" data-qualified-name="frontend job.F5" id="ent0013" data-source-line="28"><rect x="570.5" y="299.719" width="119.613" height="55.219" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="580.5" y="324.252" fill="#000" font-size="14" textLength="99.613">Integration tests</text><text x="580.5" y="341.861" fill="#000" font-size="14" textLength="44.338">(Vitest)</text></g><!--entity F6--><g class="entity" data-qualified-name="frontend job.F6" id="ent0014" data-source-line="29"><rect x="742" y="290.719" width="80.703" height="72.828" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="752" y="315.252" fill="#000" font-size="14" textLength="60.703">Coverage</text><text x="752" y="332.861" fill="#000" font-size="14" textLength="36.572">report</text><text x="752" y="350.471" fill="#000" font-size="14" textLength="50.805">(≥ 70%)</text></g><!--entity E1--><g class="entity" data-qualified-name="E1" id="ent0015" data-source-line="32"><rect x="873" y="81.219" width="152.706" height="125.656" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="883" y="105.752" fill="#000" font-size="14" textLength="48.241" font-weight="700">e2e job</text><text x="883" y="123.361" fill="#000" font-size="14"> </text><text x="883" y="140.971" fill="#000" font-size="14" textLength="84.8">Browser tests</text><text x="883" y="158.58" fill="#000" font-size="14" textLength="73.903">(Playwright)</text><text x="883" y="176.189" fill="#000" font-size="14" textLength="109.744">browser → Vite →</text><text x="883" y="193.799" fill="#000" font-size="14" textLength="132.706">FastAPI → Supabase</text></g><!--entity D1--><g class="entity" data-qualified-name="D1" id="ent0016" data-source-line="34"><rect x="868" y="262.219" width="163.199" height="178.484" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="5" ry="5"/><text x="878" y="286.752" fill="#000" font-size="14" textLength="70.021" font-weight="700">deliver job</text><text x="878" y="304.361" fill="#000" font-size="14" textLength="129.192">only on push to main</text><text x="878" y="321.971" fill="#000" font-size="14" textLength="93.386">or a sprint3 tag</text><text x="878" y="339.58" fill="#000" font-size="14"> </text><text x="878" y="357.189" fill="#000" font-size="14" textLength="88.73">build frontend,</text><text x="878" y="374.799" fill="#000" font-size="14" textLength="143.199">package versioned zip,</text><text x="878" y="392.408" fill="#000" font-size="14" textLength="83.241">smoke-test it,</text><text x="878" y="410.018" fill="#000" font-size="14" textLength="90.269">publish artifact</text><text x="878" y="427.627" fill="#000" font-size="14" textLength="115.568">(+ Release on tag)</text></g><!--link B1 to B2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk17" data-source-line="36" data-link-type="dependency"><path d="M129.35,144.219 C148.4,144.219 164.02,144.219 179.44,144.219" style="stroke:#181818;stroke-width:1;" fill="none" id="B1-to-B2"/><polygon points="184.44,144.219,175.44,140.219,179.44,144.219,175.44,148.219,184.44,144.219" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B2 to B3--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk18" data-source-line="37" data-link-type="dependency"><path d="M234.62,144.219 C251.97,144.219 270.89,144.219 291.75,144.219" style="stroke:#181818;stroke-width:1;" fill="none" id="B2-to-B3"/><polygon points="296.75,144.219,287.75,140.219,291.75,144.219,287.75,148.219,296.75,144.219" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B3 to B4--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk19" data-source-line="38" data-link-type="dependency"><path d="M389.33,144.219 C406.03,144.219 419.76,144.219 435.77,144.2