name: Tests

on:
  push:
    branches: [main]
    tags: ['sprint3*']
  pull_request:

permissions:
  contents: read

jobs:
  # Stages run in order and stop at the first failure:
  # install → lint → type check → unit tests → integration tests → coverage report.
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies (pinned)
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration" --cov=app --cov-branch --cov-report=
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Start local Supabase (throwaway test database)
        working-directory: .
        run: .github/scripts/start-local-supabase.sh
      - name: Integration tests (API → auth → database)
        env:
          PUB_ORDER_REQUIRE_INTEGRATION: "1"
        run: pytest -m integration -rs --cov=app --cov-branch --cov-append --cov-report=
      - name: Database checks (migrations, constraints and permissions)
        working-directory: .
        run: |
          psql "$PUB_ORDER_TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/menu_items.sql
          psql "$PUB_ORDER_TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/orders.sql
      - name: Coverage report (fails below 70%)
        run: coverage report --show-missing --fail-under=70

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (package-lock.json)
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      # No type-check stage: the frontend is plain JavaScript (no TypeScript).
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Coverage report (fails below 70% of branches)
        run: npm run coverage
      - name: Production build
        run: npm run build

  e2e:
    name: e2e
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies (pinned)
        run: pip install -r ../backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (package-lock.json)
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Start local Supabase (throwaway test database)
        working-directory: .
        run: .github/scripts/start-local-supabase.sh
      - name: End-to-end tests (browser → Vite → FastAPI → Supabase)
        env:
          PUB_ORDER_REQUIRE_INTEGRATION: "1"
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Continuous delivery: every push to main (and the sprint3 tag) publishes a versioned,
  # runnable build. It only runs after every test job has passed.
  deliver:
    name: deliver
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package versioned artifact
        run: |
          name="pub-order-0.3.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          mkdir -p "release/$name/backend" "release/$name/frontend"
          cp -r backend/app backend/serve.py backend/requirements.txt "release/$name/backend/"
          cp -r frontend/dist "release/$name/frontend/dist"
          cp .env.example "release/$name/"
          cp -r supabase/migrations "release/$name/migrations"
          {
            echo "# Pub-Order ${name#pub-order-}"
            echo
            echo "Built from commit ${GITHUB_SHA} (workflow run ${GITHUB_RUN_NUMBER})."
            echo
            echo "1. Copy .env.example to .env in this folder and fill in the Supabase URL and anon key."
            echo "Apply the SQL files in migrations/ in filename order to that Supabase project before use."
            echo "The server supplies the public URL and anon key to the browser at startup; no frontend rebuild is needed."
            echo "2. pip install -r backend/requirements.txt (Python 3.10+)."
            echo "3. cd backend, then run: uvicorn serve:app --port 8000"
            echo "4. Open http://127.0.0.1:8000. The API is served under /api."
          } > "release/$name/RUN.md"
          (cd release && zip -qr "$name.zip" "$name")
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Smoke-test the artifact
        run: |
          cd "release/$ARTIFACT_NAME"
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q -r backend/requirements.txt
          (cd backend && SUPABASE_URL=https://smoke.supabase.co SUPABASE_KEY=smoke-public-key /tmp/smoke/bin/uvicorn serve:app --port 8080 &)
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q "<title>Pub-Order</title>"
          curl -fs http://127.0.0.1:8080/config.js | grep -q "smoke-public-key"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/me)" = "401"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release/${{ env.ARTIFACT_NAME }}.zip
          retention-days: 90
      - name: Publish GitHub Release (sprint3 tag only)
        if: startsWith(github.ref, 'refs/tags/sprint3')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "release/$ARTIFACT_NAME.zip" \
            --title "Pub-Order $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA by workflow run $GITHUB_RUN_NUMBER after all tests passed." \
            --verify-tag
